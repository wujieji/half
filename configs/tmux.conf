# Tmux配置文件
# 设置prefix为Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# 启用鼠标
set -g mouse on

# 设置窗口和面板索引从1开始
set -g base-index 1
setw -g pane-base-index 1

# 重新加载配置
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 垂直和水平分割窗口
bind | split-window -h
bind - split-window -v

# 更新面板分隔符样式
set -g pane-border-style 'fg=colour235,bg=black'
set -g pane-active-border-style 'fg=colour51,bg=black'

# 状态栏配置
set -g status-style 'fg=colour15,bg=colour233'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '[#S] '
set -g status-right '%H:%M %Y-%m-%d'

# 窗口列表居中
set -g status-justify centre

# 使用vi键
setw -g mode-keys vi

# 增加历史记录大小
set -g history-limit 10000

# 状态栏颜色
setw -g window-status-style 'fg=colour255,bg=colour233'
setw -g window-status-current-style 'fg=colour51,bg=colour233,bold'
